name: Generate Purple Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3

        with:
          github_user_name: abhayarawat661-cmyk

          outputs: |
            dist/github-snake.svg?color_snake=%238A2BE2&color_dots=%230D1117,%233B0764,%236D28D9,%239333EA,%23C084FC

      - name: Deploy Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<h2 align="center">🐍 Contribution Snake</h2>

<div align="center">
  <img src="https://raw.githubusercontent.com/abhayarawat661-cmyk/abhayarawat661-cmyk/output/github-snake.svg" width="100%" alt="Purple Contribution Snake"/>
</div>
